# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
services:
  - type: web
    name: centerpiece-relay
    runtime: node
    rootDir: relay
    # Free instances sleep after 15 min with no traffic and take ~1 min to wake.
    # Switch to "starter" before demo night so the socket is always up.
    plan: free
    region: ohio
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: RELAY_TOKEN
        generateValue: true

  # Solana payouts API + NFT metadata host. On-chain URIs point here, so keep the
  # service name stable once players are registered.
  - type: web
    name: centerpiece-chain
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci
    startCommand: npm run -w @centerpiece/chain start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SOLANA_CLUSTER
        value: devnet
      - key: SOLANA_RPC
        sync: false # e.g. a Helius devnet URL; defaults to the public devnet RPC
      - key: AUTHORITY_SECRET
        sync: false # JSON array from the deployer keypair file (program admin)
      - key: CHAIN_API_TOKEN
        generateValue: true
