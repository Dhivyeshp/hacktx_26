; Hack the North 2026 badge (ESP32-C3-MINI-1-N4, ST7789 320x240) as the robot's face.
[env:badge]
; pioarduino pulls its packages from GitHub releases, which stay fast on venue
; Wi-Fi where the PlatformIO registry crawls.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
; The badge only has native USB-Serial-JTAG, so Serial must be that port.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.0.0
